<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06142f">
<title>ABHI LUDO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="profile"><div class="avatar">A</div><div><b>ABHI</b><small>LEVEL <span id="level">1</span></small></div></div>
  <div class="wallet"><span>💎 <b id="gems">50</b></span><span>🪙 <b id="coins">2550</b></span></div>
  <button class="icon-btn" id="settingsBtn">⚙️</button>
</header>

<main>
<section id="home" class="screen">
  <div class="logo"><div class="crown">♛</div><h1>ABHI<span>LUDO</span></h1><p>THE CLASSIC OFFLINE EXPERIENCE</p></div>
  <div class="hero-board">
    <div class="hero-piece red"></div><div class="hero-piece green"></div>
    <div class="hero-piece yellow"></div><div class="hero-piece blue"></div>
    <div class="hero-dice">⚄</div>
  </div>

  <div class="main-grid">
    <button class="main-card" data-mode="computer"><strong>🤖 COMPUTER</strong><small>Play against AI</small></button>
    <button class="main-card" data-mode="local"><strong>👥 PASS N PLAY</strong><small>2–4 players · one phone</small></button>
    <button class="main-card" data-mode="quick"><strong>⚡ QUICK GAME</strong><small>One token · faster match</small></button>
    <button class="main-card" data-mode="local"><strong>❤️ FRIENDS</strong><small>Local same-device play</small></button>
  </div>

  <div class="secondary-grid">
    <button data-panel="tournament">🏆 TOURNAMENT</button>
    <button data-panel="events">🎁 EVENTS</button>
    <button data-panel="shop">🛍 SHOP</button>
    <button data-panel="inventory">🎒 INVENTORY</button>
    <button data-panel="social">💬 SOCIAL</button>
    <button data-panel="help">❓ HELP</button>
  </div>
</section>

<section id="setup" class="screen hidden">
  <button class="back-btn" id="backSetup">←</button>
  <h2>GAME SETUP</h2>
  <div class="mode-tabs">
    <button class="mode-tab active" data-type="classic">CLASSIC<small>4 tokens</small></button>
    <button class="mode-tab" data-type="quick">QUICK<small>1 token</small></button>
    <button class="mode-tab" data-type="team">TEAM UP<small>2 vs 2</small></button>
  </div>
  <h3>PLAYERS</h3>
  <div class="count-row">
    <button class="count active" data-count="2">2P</button>
    <button class="count" data-count="3">3P</button>
    <button class="count" data-count="4">4P</button>
  </div>
  <div id="playerEditor"></div>
  <button class="primary" id="startGame">START GAME ▶</button>
</section>

<section id="game" class="screen hidden game-screen">
  <div class="game-head">
    <button class="icon-btn" id="exitGame">⌂</button>
    <div class="turn-box"><small>TURN</small><b id="turnName">RED</b></div>
    <button class="icon-btn" id="soundBtn">🔊</button>
  </div>

  <div class="board-wrap">
    <div id="board" class="board">
      <div class="zone red-zone"><b>RED</b><div class="yard" id="yard-red"></div></div>
      <div class="zone green-zone"><b>GREEN</b><div class="yard" id="yard-green"></div></div>
      <div class="zone yellow-zone"><b>YELLOW</b><div class="yard" id="yard-yellow"></div></div>
      <div class="zone blue-zone"><b>BLUE</b><div class="yard" id="yard-blue"></div></div>
      <div id="track"></div><div id="homeLanes"></div>
      <div class="finish-center"><i class="tri red"></i><i class="tri green"></i><i class="tri yellow"></i><i class="tri blue"></i></div>
      <div id="tokens"></div>
    </div>
  </div>

  <div class="game-controls">
    <button id="dice" class="dice">⚀</button>
    <button id="roll" class="roll">🎲 ROLL DICE</button>
    <div id="gameMsg">RED's turn — roll the dice</div>
  </div>

  <div class="score-row">
    <div><i class="dot red-dot"></i><small>RED</small><b id="score-red">0/4</b></div>
    <div><i class="dot green-dot"></i><small>GREEN</small><b id="score-green">0/4</b></div>
    <div><i class="dot yellow-dot"></i><small>YELLOW</small><b id="score-yellow">0/4</b></div>
    <div><i class="dot blue-dot"></i><small>BLUE</small><b id="score-blue">0/4</b></div>
  </div>
</section>
</main>

<nav class="bottom-nav">
  <button class="active" data-home>🏠<small>HOME</small></button>
  <button data-panel="tournament">🏆<small>EVENT</small></button>
  <button data-panel="inventory">🎒<small>INVENTORY</small></button>
  <button data-panel="social">💬<small>SOCIAL</small></button>
</nav>

<div class="modal hidden" id="settingsModal">
  <div class="modal-card">
    <button class="close" id="closeSettings">×</button>
    <h2>SETTINGS</h2>
    <label>Sound <input type="checkbox" id="soundToggle" checked></label>
    <label>Vibration <input type="checkbox" id="vibrationToggle" checked></label>
    <button class="danger" id="resetData">RESET LOCAL DATA</button>
  </div>
</div>

<div class="modal hidden" id="panelModal">
  <div class="modal-card">
    <button class="close" id="closePanel">×</button>
    <div id="panelContent"></div>
  </div>
</div>
<div id="toast"></div>

<script src="game.js"></script>
</div>
</body>
</html>
