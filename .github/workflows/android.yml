name: Build ABHI LUDO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show versions
        run: |
          node --version
          npm --version
          java -version

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp game.js www/
          cp manifest.webmanifest www/ 2>/dev/null || true
          cp favicon.png www/ 2>/dev/null || true

          if [ -d "assets" ]; then
            cp -r assets www/assets
          fi

          echo "Web assets:"
          find www -maxdepth 2 -type f

      - name: Check Capacitor
        run: npx cap --version

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find android -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABHI-LUDO-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
